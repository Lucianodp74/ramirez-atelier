name: Format BOM once

on:
  push:
    branches: [feat/bom-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Format BOM services
        run: npx prettier --write src/server/services/bom-preventivo-service.ts src/server/services/bom-pricing-service.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/server/services/bom-preventivo-service.ts src/server/services/bom-pricing-service.ts; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git add src/server/services/bom-preventivo-service.ts src/server/services/bom-pricing-service.ts
          git commit -m 'style: format BOM services with Prettier'
          git push

