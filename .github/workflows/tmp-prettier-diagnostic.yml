name: Temporary Prettier diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test
      - name: Print exact Prettier changes
        run: |
          npx prettier --write 'src/app/admin/(protetto)/catalogo/librerie/editor/EditorComposizioneParete.tsx'
          git diff -- 'src/app/admin/(protetto)/catalogo/librerie/editor/EditorComposizioneParete.tsx'
