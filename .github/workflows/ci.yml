name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ramirez
          POSTGRES_PASSWORD: ramirez_test_password
          POSTGRES_DB: ramirez_atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ramirez:ramirez_test_password@localhost:5432/ramirez_atelier_test?schema=public
      DIRECT_URL: postgresql://ramirez:ramirez_test_password@localhost:5432/ramirez_atelier_test?schema=public
      SITE_URL: http://localhost:3000
      RUN_POSTGRES_CONCURRENCY_TESTS: 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          # Storia completa: il format check confronta il ramo con la sua base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Prisma seed
        run: npx prisma db seed

      - name: Diagnostica Prettier documenti (temporanea)
        run: |
          for file in docs/listino-base-pareti-attrezzate.md docs/scheda-tecnica-composizione-parete-campione.md; do
            output="/tmp/$(basename "$file")"
            npx prettier "$file" > "$output"
            diff -u "$file" "$output" || true
          done

      - name: Format check
        env:
          EVENTO: ${{ github.event_name }}
          PRIMA_DEL_PUSH: ${{ github.event.before }}
        run: |
          # Su pull_request HEAD è il commit di merge: il suo primo genitore è
          # la base aggiornata, quindi il confronto contiene solo i file della PR.
          if [ "$EVENTO" = "pull_request" ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$PRIMA_DEL_PUSH"
          fi
          bash scripts/ci/format-check.sh "$base" "$GITHUB_SHA"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-build:
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Build immagine Docker
        run: docker build -t ramirez-atelier:${{ github.sha }} .
      # Nota: push verso un registry e deploy verso Staging/Production non sono
      # implementati in questo incremento - stessa decisione presa per ArtigianOS,
      # in attesa della scelta del provider di hosting (v. README).
