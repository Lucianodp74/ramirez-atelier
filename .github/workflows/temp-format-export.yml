name: Temporary editor formatter export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-export:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ramirez_atelier_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ramirez_atelier_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format editor and print encoded result
        run: |
          npx prettier --write "src/app/admin/(protetto)/catalogo/librerie/editor/EditorComposizioneParete.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/admin/(protetto)/catalogo/librerie/editor/EditorComposizioneParete.tsx"
          git diff --cached --quiet || git commit -m "style: apply Prettier to wall editor"
          git push origin HEAD:feat/editor-composizioni-pareti
