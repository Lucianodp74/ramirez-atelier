name: Temporary Prettier diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  format-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository Prettier version and print exact diff
        run: |
          npx --yes prettier@3.9.5 --write docs/ramirez-3d-specifica.md src/components/progetti/ImportaSKPViewer.tsx
          git diff -- docs/ramirez-3d-specifica.md src/components/progetti/ImportaSKPViewer.tsx
