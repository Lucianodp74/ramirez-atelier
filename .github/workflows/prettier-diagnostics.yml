name: Temporary Prettier diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  format-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format the two reported files and print exact diff
        run: |
          npx prettier --write docs/ramirez-3d-specifica.md src/components/progetti/ImportaSKPViewer.tsx
          git diff -- docs/ramirez-3d-specifica.md src/components/progetti/ImportaSKPViewer.tsx
