name: Temporary Prettier diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format the two files and commit exact Prettier output
        run: |
          npx --yes prettier@3.9.5 --write docs/ramirez-3d-specifica.md src/components/progetti/ImportaSKPViewer.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ramirez-3d-specifica.md src/components/progetti/ImportaSKPViewer.tsx
            git commit -m "style: apply repository Prettier formatting"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
